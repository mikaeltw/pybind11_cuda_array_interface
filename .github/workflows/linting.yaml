name: Linting



on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:



jobs:
  linting_python:
    name: Run Python linting tools
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Create Python venv
      run: |
        python -m venv venv

    - name: Upgrade pip
      run: |
        source venv/bin/activate
        python -m pip install -U pip>=26.1.2

    - name: Install dependencies for linting
      run: |
        source venv/bin/activate
        python -m pip install toml
        python linting/install_linters.py

    - name: Run the linting tools
      run: |
        source venv/bin/activate
        python linting/check_python_linting.py



  linting_cpp:
    name: C++ / CUDA static analysis (Clang 18, GCC 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    concurrency:
      group: cpp-lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    env:
      CLANG_VERSION: "18"
      GCC_VERSION: "13"
      PYTHON_VERSION: "3.12"
      CUDA_PATH: /usr/lib/cuda
      CUDA_ARCH: sm_70
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-${CLANG_VERSION}" \
            "clang-format-${CLANG_VERSION}" \
            "clang-tidy-${CLANG_VERSION}" \
            "g++-${GCC_VERSION}" \
            libgtest-dev \
            nvidia-cuda-toolkit

          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pybind11>=3.0.0"

      - name: Verify lint environment
        run: ./scripts/lint-cpp.sh verify

      - parallel:
        - name: Check C++ and CUDA formatting
          run: ./scripts/lint-cpp.sh format

        - name: Validate C++ with GCC
          run: ./scripts/lint-cpp.sh gcc

        - name: Run Clang-Tidy on C++
          run: ./scripts/lint-cpp.sh tidy-cpp

        - name: Run Clang-Tidy on CUDA
          run: ./scripts/lint-cpp.sh tidy-cuda
